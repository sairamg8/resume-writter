# Keeps the Job Map's jobs and companies current (tools/job-map). Weekly it re-reads every known board and
# replaces the owner's `jobmap/*` documents; monthly it also looks for new companies first and commits what it
# found (discovered.json, unresolved.json, jobs-agg.json) so the next run keeps it. Run it by hand from
# Actions → job-map-refresh → Run workflow. The upload refuses a crawl with 40% fewer roles than are stored.
# The monthly commit lands on whatever the branch is by then (it is pushed to every few hours, and the run takes
# about an hour): the step fetches the tip, puts the three files on it and tries again if the branch moved. A copy
# of the files is also kept 30 days as the run's `job-map-found` artifact. The commit carries [skip ci], so master
# moves to a commit CI never ran on: merge master into a branch before fast-forwarding it after the 1st.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a Firebase service account
# (Firebase console → Project settings → Service accounts → Generate new private key). Only the owner can add it.
name: job-map-refresh

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays: roles
    - cron: '43 2 1 * *'   # the 1st of the month: new companies, then roles
  workflow_dispatch:
    inputs:
      discover:
        description: 'Look for new companies first (about 1 hour more)'
        type: boolean
        default: false
      dry:
        description: 'Build and check, upload nothing'
        type: boolean
        default: false
      force:
        description: 'Upload even if the crawl found far fewer roles than are stored'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (the upload needs firebase-admin; the crawl needs no browser)
        working-directory: tools/job-map
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Refresh
        working-directory: tools/job-map
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCOVER: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 2 1 * *') || inputs.discover }}
          DRY: ${{ inputs.dry }}
          FORCE: ${{ inputs.force }}
        run: |
          flags=""
          [ "$DISCOVER" = "true" ] && flags="$flags --discover"
          [ "$DRY" = "true" ] && flags="$flags --dry"
          [ "$FORCE" = "true" ] && flags="$flags --force"
          node refresh.mjs $flags
      - name: Keep a copy of what discovery found
        if: ${{ success() && (inputs.discover || github.event.schedule == '43 2 1 * *') && !inputs.dry }}
        # A spare: if the artifact service fails or stalls, the commit step below must still run.
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: job-map-found
          path: |
            tools/job-map/discovered.json
            tools/job-map/unresolved.json
            tools/job-map/jobs-agg.json
          retention-days: 30
      - name: Keep what discovery found
        if: ${{ success() && (inputs.discover || github.event.schedule == '43 2 1 * *') && !inputs.dry }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::run this from a branch, not a tag (the discovery files are in the job-map-found artifact of this run)"
            exit 1
          fi
          files="tools/job-map/discovered.json tools/job-map/unresolved.json tools/job-map/jobs-agg.json"
          aside="$RUNNER_TEMP/job-map-found"
          mkdir -p "$aside"
          for f in $files; do cp "$f" "$aside/"; done
          git config user.name sairamgudiputi
          git config user.email sairamgudiputi8@gmail.com
          for attempt in 1 2 3 4 5 6; do
            if git fetch --quiet --depth=1 origin "$BRANCH" && git reset --quiet --hard FETCH_HEAD; then
              for f in $files; do cp "$aside/$(basename "$f")" "$f"; done
              git add -- $files
              if git diff --cached --quiet; then
                echo "Discovery changed nothing; nothing to commit."
                exit 0
              fi
              git commit --quiet -m "chore(job-map): monthly discovery of companies and boards [skip ci]"
              if git push origin "HEAD:refs/heads/$BRANCH"; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "::warning::push attempt $attempt did not go through (the branch may have moved); fetching its tip and trying again"
            else
              echo "::warning::fetch attempt $attempt failed; trying again"
            fi
            if [ "$attempt" -lt 6 ]; then sleep $((attempt * 20)); fi
          done
          echo "::error::could not push the discovery files after 6 attempts (the files are in the job-map-found artifact of this run)"
          exit 1
