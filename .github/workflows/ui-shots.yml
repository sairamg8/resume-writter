# Screenshots of the main screens (tests/playwright/zz-screenshots.spec.mjs), uploaded as the artifact `ui-shots`,
# so the UI can be looked at without running the app. Run it by hand: Actions → ui-shots → Run workflow.
name: ui-shots
on:
  workflow_dispatch:
concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: corepack enable && yarn install --immutable
      - name: Production build
        run: ./node_modules/.bin/vite build --mode production --outDir dist --emptyOutDir
      - name: Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Screenshots
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots
        run: ./node_modules/.bin/playwright test tests/playwright/zz-screenshots.spec.mjs --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots
          if-no-files-found: warn
          retention-days: 7
